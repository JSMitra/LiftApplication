apiVersion: v1
kind: Namespace
metadata:
  name: lift-system
  labels:
    app.kubernetes.io/name: lift-system
apiVersion: v1
kind: ConfigMap
metadata:
  name: lift-config
  namespace: lift-system
  labels:
    app.kubernetes.io/name: lift-config
data:
  # Building configuration
  floor_count: "20"
  min_floor: "0"
  lift_count: "16"

  # Redis parameters
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Timing parameters: 5 sub-steps of 0.2s = 1.0 second per floor
  STEP_DELAY_SEC: "0.2"
  FLOOR_SUB_STEPS: "5"
  DOOR_DWELL_SEC: "1.0"
  K8S_NAMESPACE: "lift-system"
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lift-system
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      name: redis
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: lift-system
  labels:
    app: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: lift-system
  labels:
    app: redis
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
            - "--dir"
            - "/data"
            - "--protected-mode"
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
apiVersion: v1
kind: Service
metadata:
  name: lift-service
  namespace: lift-system
  labels:
    app: lift-service
spec:
  clusterIP: None
  ports:
    - port: 8000
      name: http
      targetPort: 8000
  selector:
    app: lift-service
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lift-service
  namespace: lift-system
  labels:
    app: lift-service
spec:
  serviceName: lift-service
  replicas: 16
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: lift-service
  template:
    metadata:
      labels:
        app: lift-service
    spec:
      containers:
        - name: lift-service
          image: lift-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_TYPE
              value: "lift"
            # Injects the exact pod name (e.g. lift-service-0, lift-service-15) via Downward API
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: floor_count
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: floor_count
            - name: min_floor
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: min_floor
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: REDIS_PORT
            - name: STEP_DELAY_SEC
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: STEP_DELAY_SEC
            - name: FLOOR_SUB_STEPS
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: FLOOR_SUB_STEPS
            - name: DOOR_DWELL_SEC
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: DOOR_DWELL_SEC
            - name: K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: K8S_NAMESPACE
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
apiVersion: v1
kind: Service
metadata:
  name: lift-orchestrator
  namespace: lift-system
  labels:
    app: lift-orchestrator
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
  selector:
    app: lift-orchestrator
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lift-orchestrator
  namespace: lift-system
  labels:
    app: lift-orchestrator
spec:
  serviceName: lift-orchestrator
  replicas: 1
  selector:
    matchLabels:
      app: lift-orchestrator
  template:
    metadata:
      labels:
        app: lift-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: lift-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_TYPE
              value: "orchestrator"
            - name: floor_count
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: floor_count
            - name: min_floor
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: min_floor
            - name: lift_count
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: lift_count
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: REDIS_PORT
            - name: K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: lift-config
                  key: K8S_NAMESPACE
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: orchestrator-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: orchestrator-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
